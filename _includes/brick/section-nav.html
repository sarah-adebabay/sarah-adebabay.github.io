{% comment %}Section tabs plus the CV and Contact buttons. include.prefix is "" on the home page and the site root elsewhere.{% endcomment %}
{% include base_path %}
<ul class="tabs">
  {% for t in site.data.tabs %}<li><a href="{{ include.prefix }}#{{ t.id }}" data-tab="{{ t.id }}">{{ t.label }}</a></li>
  {% endfor %}
</ul>
<div class="nav-buttons">
  <a class="nav-btn cv" href="{{ base_path }}/cv/"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
  {% if site.author.linkedin %}<a class="nav-btn li-btn" href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="currentColor"/><path d="M8 10.5v6.5 M8 7.2v.1 M11.5 17v-6.5 M11.5 13.5c0-1.9 1.1-3 2.6-3s2.4 1 2.4 3V17" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" style="stroke: var(--surface)"/></svg></a>{% endif %}
  <a class="nav-btn contact-btn" href="{{ include.prefix }}#contact">Contact</a>
</div>
