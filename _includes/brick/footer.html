{% include base_path %}
<footer>
  <div class="inner">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
    <button class="theme-toggle" id="theme" type="button" aria-label="Switch color theme">Switch theme</button>
  </div>
</footer>
<script>
  (function () {
    var root = document.documentElement;
    document.getElementById('theme').addEventListener('click', function () {
      var dark = root.getAttribute('data-theme') === 'dark' ||
        (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var next = dark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    // Scholarship pills on the Education cards: tapping one stretches it across the card to show the award's description.
    document.querySelectorAll('.sch').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.setAttribute('aria-expanded', String(btn.getAttribute('aria-expanded') !== 'true'));
      });
    });
  })();
</script>
