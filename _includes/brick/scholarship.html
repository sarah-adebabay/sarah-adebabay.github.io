{% comment %}A school's scholarship as a pill. Tapping it opens the pill to show what the award is.{% endcomment %}
{% if include.s %}<details class="sch">
  <summary><svg class="sch-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8.5 14 7 22l5-2.6L17 22l-1.5-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><span>{{ include.s.name }}</span><svg class="sch-plus" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></summary>
  <p>{{ include.s.about }}</p>
</details>{% endif %}
